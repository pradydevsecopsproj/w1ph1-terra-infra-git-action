name: Terraform Drift Detection

on:
#   schedule:
# #    - cron: '0 8 * * *' # Runs every day at 8am UTC
  workflow_dispatch: # Allows manual triggering

env:
  AWS_REGION: ap-south-1
  TF_WORKING_DIR: ./Infra-repo/root/

jobs:
  drift-detection:
    name: Detect Drift
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
        working-directory: ${{ env.TF_WORKING_DIR }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.13.3
          terraform_wrapper: false # "false " to capture the raw or actual exit-code otherwise "ture" (by default) will hide and return exit code as 0 iven though there a drift

      - name: Terraform Init
        run: terraform init

      - name: Terraform Plan (Drift Detection)
        id: plan
        continue-on-error: true
        run: |
          set +e

          terraform plan \
            -detailed-exitcode \
            -no-color \
            -input=false \
            > plan_output.txt 2>&1

          EXIT_CODE=$?

          echo "Terraform plan exit code: $EXIT_CODE"

          echo "exitcode=$EXIT_CODE" >> "$GITHUB_OUTPUT"

          echo "========== Terraform Plan Output =========="
          cat plan_output.txt
          echo "==========================================="

          # Do not let this step stop the workflow.
          # We evaluate the exit code in the next step.
          exit 0

      - name: Analyze Drift
        if: steps.plan.outputs.exitcode == '2'
        uses: actions/github-script@v7
        env:
          PLAN_OUTPUT: ./Infra-repo/root/plan_output.txt
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');
            const planOutput = fs.readFileSync(process.env.PLAN_OUTPUT, 'utf8');
            const body = `### Drift Detected
            
            Terraform has detected changes in the infrastructure that are not in the state file.
            
            <details>
            <summary>Show Plan</summary>
            
            \`\`\`terraform
            ${planOutput.slice(0, 65000)}
            \`\`\`
            
            </details>
            
            Please review the changes and apply them or update the code.`;
            
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: '🚨 Terraform Drift Detected',
              body: body
            });
            
            core.setFailed('Drift detected! Infrastructure state does not match configuration.');

      - name: Publish Drift Summary
        if: steps.plan.outputs.exitcode == '2'
        run: |
          echo "### 🚨 Drift Detected" >> $GITHUB_STEP_SUMMARY
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Terraform detected infrastructure changes." >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Please review the Terraform plan and the GitHub issue created by this workflow." >> "$GITHUB_STEP_SUMMARY" 
      
      - name: No Drift
        if: steps.plan.outputs.exitcode == '0'
        run: |
          echo "No drift detected. Infrastructure is in sync."
          echo "### ✅ No Drift Detected" >> $GITHUB_STEP_SUMMARY
          echo "Infrastructure is in sync with the configuration." >> $GITHUB_STEP_SUMMARY

      - name: Terraform Plan Failure
        if: steps.plan.outputs.exitcode == '1'
        run: |
          echo "::error::Terraform plan failed."
          exit 1
    
      # Unexpected Exit Code
      - name: Unexpected Terraform Exit Code
        if: |
          steps.plan.outputs.exitcode != '0' &&
          steps.plan.outputs.exitcode != '1' &&
          steps.plan.outputs.exitcode != '2'
        run: |
          echo "::error::Unexpected Terraform exit code: ${{ steps.plan.outputs.exitcode }}"
          exit 1


      
      # Upload Drift Report     
      - name: Upload Drift Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: terraform-drift-report
          path: ./Infra-repo/root/plan_output.txt